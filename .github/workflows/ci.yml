name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref instead of queueing them.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      # No secrets are needed: scripts/support/testEnv.ts fills every config key
      # with an inert placeholder, and the two database-backed cases in
      # scripts/signed-download.test.ts skip themselves when no real
      # DATABASE_URL is present.
      - name: Test
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Typecheck tests
        run: npm run typecheck:test

      - name: Build
        run: npm run build
